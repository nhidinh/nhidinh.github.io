<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ page.title }}</title>

<style>

body{
font-family:system-ui, Arial;
max-width:900px;
margin:auto;
padding:40px;
line-height:1.7;
color:#222;
background:white;
}

.back{
display:inline-block;
margin-bottom:30px;
text-decoration:none;
color:#0366d6;
font-size:14px;
}

.back:hover{
text-decoration:underline;
}

h1{
margin-top:0;
margin-bottom:10px;
}

h2{
margin-top:40px;
}

p{
margin:16px 0;
max-width:750px;
}

ul{
margin:16px 0;
padding-left:20px;
}

blockquote{
border-left:4px solid #e5e7eb;
padding-left:16px;
color:#555;
margin:20px 0;
}

.callout{
border-left:4px solid #3b82f6;
padding:12px 16px;
margin:24px 0;
background:#f8fafc;
}

.toc{
border:1px solid #e5e7eb;
padding:16px;
margin:30px 0;
background:#fafafa;
}

.toc ul{
margin:10px 0 0 0;
padding-left:18px;
}

.toc a{
text-decoration:none;
color:#0366d6;
}

.toc a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<a class="back" href="/">← Back</a>

<h1>{{ page.title }}</h1>

<div class="toc">
<strong>Contents</strong>
<ul id="toc-list"></ul>
</div>

{{ content }}

<script>

const headings = document.querySelectorAll("h2");
const tocList = document.getElementById("toc-list");

headings.forEach((heading, index) => {

    const id = "section-" + index;
    heading.id = id;

    const li = document.createElement("li");
    const a = document.createElement("a");

    a.href = "#" + id;
    a.textContent = heading.textContent;

    li.appendChild(a);
    tocList.appendChild(li);

});

</script>

</body>

</html>
